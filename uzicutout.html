<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzi Cutout</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .image-viewer {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .image-viewer img {
            max-width: 100%;
            max-height: 80vh;
            border: 1px solid #3f3f46;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .back-btn-fixed {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <main class="image-viewer">
        <img src="UziCutout_2048.png" alt="Asset Preview">
    </main>

    <a href="https://sourceengineguy.github.io/" class="action-btn back-btn-fixed">SourceEngineGuy's Website → </a>

    <script src="app.js"></script>
</body>
</html>
